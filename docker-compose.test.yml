# Docker Compose for Test Environment
# Usage: docker compose -f docker-compose.test.yml up -d
# This creates an isolated test database on port 5433

services:
  # Test PostgreSQL Database
  postgres-test:
    image: postgres:14-alpine
    container_name: habitcraft-db-test
    environment:
      POSTGRES_DB: habitcraft_test
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: habitpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - habitcraft-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser -d habitcraft_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Database Migrations for Test Environment
  db-migrate-test:
    image: ghcr.io/amacneil/dbmate:2
    container_name: habitcraft-db-migrate-test
    environment:
      DATABASE_URL: postgresql://habituser:habitpass@postgres-test:5432/habitcraft_test?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
      - ./shared/database/test-fixtures.sql:/db/test-fixtures.sql:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - habitcraft-test-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        dbmate --wait --wait-timeout 60s up && \
        psql "$$DATABASE_URL" -f /db/test-fixtures.sql

  # Node.js Backend for Integration Tests
  backend-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: habitcraft-backend-test
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://habituser:habitpass@postgres-test:5432/habitcraft_test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: habitcraft_test
      DB_USER: habituser
      DB_PASSWORD: habitpass
      JWT_SECRET: test-jwt-secret-key-for-testing-only
      FRONTEND_URL: http://localhost:3110
      SKIP_RATE_LIMIT: "true"
    ports:
      - "3010:3000"
    volumes:
      - ./backend:/app
      - backend_node_test_modules:/app/node_modules
    depends_on:
      db-migrate-test:
        condition: service_completed_successfully
    networks:
      - habitcraft-test-network
    command: npm run dev

  # Next.js Frontend for E2E Tests
  frontend-test:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: habitcraft-frontend-test
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3010
    ports:
      - "3110:3100"
    # Named volumes prevent stale node_modules issues that can occur with anonymous volumes.
    # Anonymous volumes (/app/node_modules) persist across rebuilds and can contain outdated
    # dependencies. Named volumes are explicitly managed and cleaned up with `docker compose down -v`.
    volumes:
      - ./frontend:/app
      - frontend_test_modules:/app/node_modules
      - frontend_test_next:/app/.next
    networks:
      - habitcraft-test-network
    command: npm run dev

networks:
  habitcraft-test-network:
    driver: bridge

volumes:
  postgres_test_data:
  backend_node_test_modules:
  frontend_test_modules:
  frontend_test_next:
