services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: habitcraft-db
    environment:
      POSTGRES_DB: ${DB_NAME:-habitcraft}
      POSTGRES_USER: ${DB_USER:-habituser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habitpass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habitcraft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-habituser} -d ${DB_NAME:-habitcraft}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migrations (runs once before backends start)
  db-migrate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: habitcraft-db-migrate
    environment:
      DATABASE_URL: postgresql://${DB_USER:-habituser}:${DB_PASSWORD:-habitpass}@postgres:5432/${DB_NAME:-habitcraft}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - habitcraft-network
    command: ["--wait", "--wait-timeout", "60s", "up"]

  # Seed data for development (run manually: docker compose run --rm db-seed)
  # Uses test-fixtures.sql for consistency with CI/test environments
  db-seed:
    image: postgres:14-alpine
    container_name: habitcraft-db-seed
    environment:
      PGPASSWORD: ${DB_PASSWORD:-habitpass}
    volumes:
      - ./shared/database/test-fixtures.sql:/seed.sql:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - habitcraft-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${DB_USER:-habituser} -d ${DB_NAME:-habitcraft} -f /seed.sql
    profiles:
      - seed

  # Node.js Backend
  backend-node:
    build:
      context: .
      dockerfile: backends/node/Dockerfile.dev
    container_name: habitcraft-backend-node
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-habituser}:${DB_PASSWORD:-habitpass}@postgres:5432/${DB_NAME:-habitcraft}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-habitcraft}
      DB_USER: ${DB_USER:-habituser}
      DB_PASSWORD: ${DB_PASSWORD:-habitpass}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backends/node:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - habitcraft-network
    command: npm run dev

  # Next.js Frontend
  frontend-nextjs:
    build:
      context: .
      dockerfile: frontends/nextjs/Dockerfile.dev
    container_name: habitcraft-frontend-nextjs
    environment:
      # Note: API URL is accessed from the browser, not from the container
      # So we use localhost (host machine) not backend-node (container network)
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      # PostHog Analytics (optional)
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "3100:3100"
    volumes:
      - ./frontends/nextjs:/app
      - /app/node_modules
      - /app/.next
    networks:
      - habitcraft-network
    command: npm run dev

  # Adminer - Database management UI
  adminer:
    image: adminer:latest
    container_name: habitcraft-adminer
    ports:
      - "8080:8080"
    networks:
      - habitcraft-network
    depends_on:
      - postgres

networks:
  habitcraft-network:
    driver: bridge

volumes:
  postgres_data:
  backend_node_modules:
