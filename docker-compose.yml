services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: habitcraft-db
    environment:
      POSTGRES_DB: ${DB_NAME:-habitcraft}
      POSTGRES_USER: ${DB_USER:-habituser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habitpass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - habitcraft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-habituser} -d ${DB_NAME:-habitcraft}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migrations (runs once before backends start)
  # "habitcraft migrate", from the server image's API-only target. The
  # migrations are embedded in the binary (server/schema/), so nothing is
  # mounted, and pull_policy: build rebuilds it on every `up`: a stale image
  # would silently skip a migration added since. Go's build cache keeps an
  # unchanged rebuild to seconds.
  db-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: migrate
    pull_policy: build
    container_name: habitcraft-db-migrate
    environment:
      DATABASE_URL: postgresql://${DB_USER:-habituser}:${DB_PASSWORD:-habitpass}@postgres:5432/${DB_NAME:-habitcraft}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - habitcraft-network

  # Seed data for development (run manually: docker compose run --rm db-seed)
  # Uses test-fixtures.sql for consistency with CI/test environments
  db-seed:
    image: postgres:14-alpine
    container_name: habitcraft-db-seed
    environment:
      PGPASSWORD: ${DB_PASSWORD:-habitpass}
    volumes:
      - ./shared/database/test-fixtures.sql:/seed.sql:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - habitcraft-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${DB_USER:-habituser} -d ${DB_NAME:-habitcraft} -f /seed.sql
    profiles:
      - seed

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: habitcraft-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-habituser}:${DB_PASSWORD:-habitpass}@postgres:5432/${DB_NAME:-habitcraft}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-habitcraft}
      DB_USER: ${DB_USER:-habituser}
      DB_PASSWORD: ${DB_PASSWORD:-habitpass}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - habitcraft-network
    command: npm run dev

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: habitcraft-frontend
    environment:
      # Note: API URL is accessed from the browser, not from the container
      # So we use localhost (host machine) not backend (container network)
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      # PostHog Analytics (optional)
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "3100:3100"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - habitcraft-network
    command: npm run dev

  # Go server (the rebuild, habitcraft-vxln), beside the Node backend until
  # cutover. air rebuilds and restarts it on a change to server/*.go
  # (server/.air.toml). Host port 3030: adminer holds 8080, the server's
  # default, and server-test holds 3020 (habitcraft-vxln.20).
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: habitcraft-server
    environment:
      DATABASE_URL: postgresql://${DB_USER:-habituser}:${DB_PASSWORD:-habitpass}@postgres:5432/${DB_NAME:-habitcraft}?sslmode=disable
      # The Node backend's secret, so a session from either is honoured by both
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PORT: 8080
      INSECURE_COOKIES: "true"
    ports:
      - "${SERVER_PORT:-3030}:8080"
    volumes:
      - ./server:/src/server
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - habitcraft-network

  # React + Vite web app (the rebuild), with hot reload. It proxies /api and
  # /health to `server`, so the app and the API share an origin as they do
  # in production, where the Go server embeds the built app.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: habitcraft-web
    environment:
      HABITCRAFT_API_URL: http://server:8080
    ports:
      - "3200:3200"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - habitcraft-network

  # Adminer - Database management UI
  adminer:
    image: adminer:latest
    container_name: habitcraft-adminer
    ports:
      - "8080:8080"
    networks:
      - habitcraft-network
    depends_on:
      - postgres

networks:
  habitcraft-network:
    driver: bridge

volumes:
  postgres_data:
  backend_node_modules:
  web_node_modules:
  go_mod_cache:
  go_build_cache:
