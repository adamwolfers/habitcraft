name: Link Check

# Deliberately a separate workflow from ci.yml rather than a job inside it:
# ci.yml sets `paths-ignore: ['**/*.md', 'docs/**']` on both push and
# pull_request, so a job living there would never run on a docs-only change --
# exactly when links rot. The triggers here are the inverse of ci.yml's.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/link-check.yml'

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check relative links in markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.md'
          # Surface broken links as a job failure. Without this the action
          # reports them and still exits 0, which would make this gate
          # decorative.
          fail: true
