name: CI
# CI/CD pipeline with Workload Identity Federation (Terraform-managed)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild E2E test containers (bypass BuildKit cache)'
        type: boolean
        default: false
      build_mobile_production:
        description: 'Build and submit mobile app to app stores'
        type: boolean
        default: false
  push:
    branches: ['**']
    tags:
      - 'mobile-v*'
    # DO NOT REMOVE without first reading the note below. This overlaps the
    # dorny/paths-filter gating in detect-changes, but is not redundant with
    # it -- it is load-bearing.
    #
    # Six markdown files live *inside* package directories and therefore match
    # a paths-filter pattern as well as '**/*.md' here:
    #
    #   backend/README.md, backend/db/README.md   -> backend
    #   frontends/nextjs/README.md                -> frontend
    #   db/README.md                              -> db
    #   shared/{database,types}/README.md         -> shared
    #
    # paths-filter matches on path alone and cannot tell a README from source.
    # Without this paths-ignore, editing db/README.md on master would fire
    # run-migrations-gcp (Cloud SQL backup + production migration job), and
    # editing shared/types/README.md would fire deploy-backend-gcp and
    # deploy-frontend-gcp. Those jobs are gated on `db`/`shared` being true,
    # which a README edit satisfies.
    #
    # To remove this safely, first make each filter code-aware by adding
    # `- '!**/*.md'` to every pattern in detect-changes. Tighten the filters,
    # then drop the blunt instrument -- not the reverse.
    #
    # Consequence: no job in this workflow can run on markdown, docs/, or
    # infrastructure/ changes. Doc links are checked by
    # .github/workflows/link-check.yml, whose triggers are the inverse of
    # these; a docs job added *here* could never fire on a docs-only change.
    paths-ignore:
      - '**/*.md'
      - '.beads/**'
      - 'docs/**'
      - 'infrastructure/**'
      - 'LICENSE'
      - '.gitignore'
      # Below: paths that match no filter in detect-changes, so they would
      # otherwise trigger the workflow and then skip every job -- a passing
      # run that verified nothing. Listed here so they do not trigger at all.
      - '.claude/**'
      - '.gitattributes'
      - '.git-blame-ignore-revs'
      - '.dbmaterc'
      - 'lychee.toml'
      - '**/*.example'
      # Has its own workflow with its own triggers; nothing here tests it.
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main, master]
    # Keep in sync with the push trigger above; see the rationale there.
    paths-ignore:
      - '**/*.md'
      - '.beads/**'
      - 'docs/**'
      - 'infrastructure/**'
      - 'LICENSE'
      - '.gitignore'
      # Below: paths that match no filter in detect-changes, so they would
      # otherwise trigger the workflow and then skip every job -- a passing
      # run that verified nothing. Listed here so they do not trigger at all.
      - '.claude/**'
      - '.gitattributes'
      - '.git-blame-ignore-revs'
      - '.dbmaterc'
      - 'lychee.toml'
      - '**/*.example'
      # Has its own workflow with its own triggers; nothing here tests it.
      - '.github/workflows/link-check.yml'

jobs:
  # ===========================================
  # Path Detection (runs first to determine which jobs to run)
  # ===========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      db: ${{ steps.filter.outputs.db }}
      shared: ${{ steps.filter.outputs.shared }}
      e2e-infra: ${{ steps.filter.outputs.e2e-infra }}
      tooling: ${{ steps.filter.outputs.tooling }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'every' (all patterns must match), NOT the default 'some'.
          #
          # This is required for the '!**/*.md' exclusions below to work, and
          # the default is actively dangerous here: under 'some', a negated
          # pattern is OR-ed in, and since '!**/*.md' matches every file that
          # is not markdown, adding it would make each filter true for ALL
          # non-markdown changes -- 'backend' would fire on scripts/test-all.sh.
          # Verified against picomatch 4.0.5, the library this action uses.
          #
          # Consequence: a filter may have only ONE positive pattern, since
          # under 'every' a file must match all of them. Multiple alternatives
          # must be expressed as one extglob '@(a|b|c)' pattern -- see
          # e2e-infra and tooling below.
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'backend/**'
              - '!**/*.md'
            frontend:
              - 'frontends/nextjs/**'
              - '!**/*.md'
            mobile:
              - 'mobile/**'
              - '!**/*.md'
            db:
              - 'db/**'
              - '!**/*.md'
            shared:
              - 'shared/**'
              - '!**/*.md'
            # Single extglob rather than three patterns: 'every' would require a
            # file to match all three at once, which nothing does.
            e2e-infra:
              - '@(docker-compose*.yml|docker-bake*.hcl|**/Dockerfile*)'
              - '!**/*.md'
            # Repo-level tooling that changes how tests run everywhere but
            # belongs to no single package. Without this, editing
            # scripts/test-all.sh triggered the workflow and then skipped every
            # job -- a green check that ran nothing.
            tooling:
              - '@(scripts/**|.husky/**|package.json|package-lock.json)'
              - '!**/*.md'
            workflow:
              - '.github/workflows/ci.yml'

  # ===========================================
  # Unit Tests
  # ===========================================
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.tooling == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: backend/coverage
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-unit-tests, frontend-unit-tests]
    # Use always() to run even when upstream jobs are skipped (due to path filtering)
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.frontend == 'true' ||
        needs.detect-changes.outputs.db == 'true' ||
        needs.detect-changes.outputs.shared == 'true' ||
        needs.detect-changes.outputs.workflow == 'true'
      )
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: habitcraft_test
          POSTGRES_USER: habituser
          POSTGRES_PASSWORD: habitpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U habituser -d habitcraft_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate

      - name: Initialize test database schema
        env:
          DATABASE_URL: postgresql://habituser:habitpass@localhost:5433/habitcraft_test?sslmode=disable
          PGPASSWORD: habitpass
          MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
          FIXTURES_FILE: ${{ github.workspace }}/shared/database/test-fixtures.sql
        run: |
          set -e  # Fail fast on any error

          echo "=== Pre-flight check: dbmate status ==="
          if ! dbmate --migrations-dir "$MIGRATIONS_DIR" status; then
            echo "ERROR: dbmate status failed - check database connection and migration files"
            exit 1
          fi
          echo ""

          echo "=== Applying migrations ==="
          dbmate --migrations-dir "$MIGRATIONS_DIR" up
          echo ""

          echo "=== Post-migration verification ==="
          STATUS_OUTPUT=$(dbmate --migrations-dir "$MIGRATIONS_DIR" status)
          echo "$STATUS_OUTPUT"
          if echo "$STATUS_OUTPUT" | grep -q "\[ \]"; then
            echo ""
            echo "ERROR: Pending migrations found after 'dbmate up' - this should not happen"
            exit 1
          fi
          echo "All migrations applied successfully"
          echo ""

          echo "=== Verifying schema ==="
          psql -h localhost -p 5433 -U habituser -d habitcraft_test -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;"
          echo ""

          echo "=== Loading test fixtures ==="
          psql -h localhost -p 5433 -U habituser -d habitcraft_test -f "$FIXTURES_FILE"

      - name: Run integration tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: habitcraft_test
          DB_USER: habituser
          DB_PASSWORD: habitpass
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          FRONTEND_URL: http://localhost:3110
          SKIP_RATE_LIMIT: 'true'
        run: npm run test:integration

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.tooling == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: frontends/nextjs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontends/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: frontends/nextjs/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  mobile-unit-tests:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.mobile == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      needs.detect-changes.outputs.tooling == 'true' ||
      needs.detect-changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload mobile coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: mobile/coverage
          flags: mobile
          name: mobile-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-integration-tests]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.frontend == 'true' ||
        needs.detect-changes.outputs.db == 'true' ||
        needs.detect-changes.outputs.shared == 'true' ||
        needs.detect-changes.outputs.e2e-infra == 'true' ||
        needs.detect-changes.outputs.workflow == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need history to compare changes

      - name: Check for dependency changes
        id: deps-changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi

          # Handle case where BASE_SHA is empty (first push, workflow_dispatch)
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
            echo "changed=unknown" >> $GITHUB_OUTPUT
            echo "ℹ️ Cannot determine dependency changes (first push or manual trigger)"
            exit 0
          fi

          BACKEND_DEPS=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'backend/package-lock.json' | wc -l)
          FRONTEND_DEPS=$(git diff --name-only $BASE_SHA ${{ github.sha }} -- 'frontends/nextjs/package-lock.json' | wc -l)

          if [ "$BACKEND_DEPS" -gt 0 ] || [ "$FRONTEND_DEPS" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Dependencies changed - BuildKit will rebuild affected layers"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No dependency changes - BuildKit will use cached layers"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontends/nextjs/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test containers with cache
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.test.yml
            docker-bake.test.hcl
          set: |
            ${{ !inputs.force_rebuild && '*.cache-from=type=gha' || '' }}
            *.cache-to=type=gha,mode=max
          load: true

      - name: Install frontend dependencies
        working-directory: frontends/nextjs
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontends/nextjs
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -s http://localhost:3010/health > /dev/null; do sleep 2; done'
          echo "Backend is ready!"
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -s http://localhost:3110 > /dev/null; do sleep 2; done'
          echo "Frontend is ready!"

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        working-directory: frontends/nextjs
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob

      - name: Upload blob report (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: frontends/nextjs/blob-report/
          retention-days: 1

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e-merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    # Only run if e2e-tests actually ran (not skipped)
    if: always() && needs.e2e-tests.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: frontends/nextjs
        run: npm install @playwright/test

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        working-directory: frontends/nextjs
        run: npx playwright merge-reports --reporter html "$GITHUB_WORKSPACE/all-blob-reports"

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontends/nextjs/playwright-report/
          retention-days: 7

  # ===========================================
  # GCP Cloud Run Deployment
  # ===========================================

  run-migrations-gcp:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-unit-tests, backend-integration-tests, frontend-unit-tests, e2e-tests]
    # Only run migrations when db/ changed
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      always() &&
      !failure() &&
      !cancelled() &&
      needs.detect-changes.outputs.db == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push migrations image
        run: |
          docker build -t us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/migrations:${{ github.sha }} ./db
          docker tag us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/migrations:${{ github.sha }} us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/migrations:latest
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/migrations:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/migrations:latest

      - name: Create pre-migration backup
        run: |
          echo "Creating Cloud SQL backup before migration..."
          gcloud sql backups create \
            --instance=habitcraft-db \
            --description="Pre-migration backup for commit ${{ github.sha }}"
          echo "Backup created successfully"

      - name: Run migrations
        run: |
          echo "Executing migration job..."
          gcloud run jobs execute habitcraft-migrations \
            --region us-central1 \
            --wait
          echo "Migration job completed"

      - name: Verify migration success
        run: |
          echo "Verifying migration completed successfully..."
          # Get the latest execution and check its status
          EXECUTION=$(gcloud run jobs executions list \
            --job=habitcraft-migrations \
            --region=us-central1 \
            --limit=1 \
            --format="value(name)")
          STATUS=$(gcloud run jobs executions describe $EXECUTION \
            --region=us-central1 \
            --format="value(status.completionTime)")
          if [ -z "$STATUS" ]; then
            echo "ERROR: Migration execution did not complete successfully"
            exit 1
          fi
          echo "Migration verified: $EXECUTION completed at $STATUS"

  deploy-backend-gcp:
    name: Deploy Backend to GCP
    runs-on: ubuntu-latest
    needs: [detect-changes, run-migrations-gcp]
    # Deploy when backend, db, or shared changed (migrations may be skipped if no db changes)
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.detect-changes.outputs.backend == 'true' ||
        needs.detect-changes.outputs.db == 'true' ||
        needs.detect-changes.outputs.shared == 'true'
      )

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          docker build -t us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:${{ github.sha }} ./backend
          docker tag us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:${{ github.sha }} us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:latest
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy habitcraft-backend \
            --image us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/backend:${{ github.sha }} \
            --region us-central1 \
            --quiet

      - name: Verify deployment
        run: |
          BACKEND_URL=$(gcloud run services describe habitcraft-backend --region us-central1 --format='value(status.url)')
          echo "Backend URL: ${BACKEND_URL}"
          for i in {1..10}; do
            if curl -sf "${BACKEND_URL}/health" > /dev/null; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/10)"
            sleep 5
          done
          echo "❌ Backend health check failed"
          exit 1

  deploy-frontend-gcp:
    name: Deploy Frontend to GCP
    runs-on: ubuntu-latest
    needs: [detect-changes, run-migrations-gcp]
    # Deploy when frontend or shared changed (migrations may be skipped if no db changes)
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.detect-changes.outputs.frontend == 'true' ||
        needs.detect-changes.outputs.shared == 'true'
      )

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.habitcraft.org \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }} \
            -t us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:${{ github.sha }} \
            ./frontends/nextjs
          docker tag us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:${{ github.sha }} us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:latest
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy habitcraft-frontend \
            --image us-central1-docker.pkg.dev/habitcraft-prod/habitcraft-containers/frontend:${{ github.sha }} \
            --region us-central1 \
            --quiet

      - name: Verify deployment
        run: |
          FRONTEND_URL=$(gcloud run services describe habitcraft-frontend --region us-central1 --format='value(status.url)')
          echo "Frontend URL: ${FRONTEND_URL}"
          for i in {1..10}; do
            if curl -sf "${FRONTEND_URL}" > /dev/null; then
              echo "✅ Frontend is healthy"
              exit 0
            fi
            echo "Waiting for frontend... (attempt $i/10)"
            sleep 5
          done
          echo "❌ Frontend health check failed"
          exit 1

  # ===========================================
  # Mobile EAS Builds
  # ===========================================

  build-mobile-preview:
    name: Build Mobile Preview
    runs-on: ubuntu-latest
    needs: [detect-changes, mobile-unit-tests]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.detect-changes.outputs.mobile == 'true' ||
        needs.detect-changes.outputs.shared == 'true'
      )
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build preview (Android only until iOS credentials configured)
        run: npx eas-cli build --profile preview --platform android --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-mobile-production:
    name: Build & Submit Mobile Production
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_mobile_production) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v'))
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production (iOS + Android)
        run: npx eas-cli build --profile production --platform all --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to app stores
        run: npx eas-cli submit --profile production --platform all --non-interactive --latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

